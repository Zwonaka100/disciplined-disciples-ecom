<!DOCTYPE html>
<html lang="en">
<head>
    <script>if(/^(disciplined-disciples-1\.(web\.app|firebaseapp\.com))$/.test(location.hostname)){location.replace('https://disciplineddisciples.co.za'+location.pathname+location.search+location.hash);}</script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Collaborations - Admin</title>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
    <script src="js/admin-auth-guard.js?v=20260602a"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="icon" type="image/png" href="Assets/45.png">
</head>
<body class="bg-slate-100 min-h-screen text-slate-900">
    <div class="flex min-h-screen">
        <aside id="admin-sidebar" class="w-64 bg-white border-r border-gray-200 fixed h-full overflow-y-auto z-30"></aside>

        <main class="flex-1 ml-64 p-8 space-y-6">
            <header class="flex items-center justify-between">
                <div><h1 class="text-2xl font-bold">Collaboration Pipeline</h1><p class="text-slate-500">Manage corporate, university, and brand partnership opportunities.</p></div>
                <button id="collab-toggle-form" class="px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition">Add Lead</button>
            </header>

            <div id="collab-alert" class="hidden rounded-lg border px-4 py-3 text-sm"></div>

            <section id="collab-form-wrap" class="hidden bg-white rounded-xl shadow p-6">
                <h2 class="text-lg font-semibold mb-4">New Collaboration Lead</h2>
                <form id="collab-form" class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <input id="collab-org" type="text" required placeholder="Organization" class="border border-slate-200 rounded-lg px-3 py-2">
                    <select id="collab-type" class="border border-slate-200 rounded-lg px-3 py-2">
                        <option value="corporate">Corporate</option>
                        <option value="university">University / Professional Body</option>
                        <option value="brand">Brand Collaboration</option>
                    </select>
                    <input id="collab-contact" type="text" placeholder="Contact person" class="border border-slate-200 rounded-lg px-3 py-2">
                    <input id="collab-email" type="email" placeholder="Contact email" class="border border-slate-200 rounded-lg px-3 py-2">
                    <input id="collab-value" type="number" min="0" step="0.01" placeholder="Potential value (R)" class="border border-slate-200 rounded-lg px-3 py-2">
                    <input id="collab-next" type="text" placeholder="Next action" class="border border-slate-200 rounded-lg px-3 py-2">
                    <div class="md:col-span-2 flex gap-3">
                        <button type="submit" class="px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition">Save Lead</button>
                        <button id="collab-cancel" type="button" class="px-4 py-2 border border-slate-200 rounded-lg hover:bg-slate-50 transition">Cancel</button>
                    </div>
                </form>
            </section>

            <section class="grid grid-cols-2 md:grid-cols-3 xl:grid-cols-6 gap-4">
                <article class="bg-white rounded-xl shadow p-4"><p class="text-xs uppercase text-slate-500">New</p><p id="collab-stat-new" class="text-2xl font-semibold mt-1">0</p></article>
                <article class="bg-white rounded-xl shadow p-4"><p class="text-xs uppercase text-slate-500">Discovery</p><p id="collab-stat-discovery" class="text-2xl font-semibold mt-1">0</p></article>
                <article class="bg-white rounded-xl shadow p-4"><p class="text-xs uppercase text-slate-500">Proposal</p><p id="collab-stat-proposal" class="text-2xl font-semibold mt-1">0</p></article>
                <article class="bg-white rounded-xl shadow p-4"><p class="text-xs uppercase text-slate-500">Negotiation</p><p id="collab-stat-negotiation" class="text-2xl font-semibold mt-1">0</p></article>
                <article class="bg-white rounded-xl shadow p-4"><p class="text-xs uppercase text-slate-500">Won</p><p id="collab-stat-won" class="text-2xl font-semibold mt-1">0</p></article>
                <article class="bg-white rounded-xl shadow p-4"><p class="text-xs uppercase text-slate-500">Lost</p><p id="collab-stat-lost" class="text-2xl font-semibold mt-1">0</p></article>
            </section>

            <section class="bg-white rounded-xl shadow overflow-hidden">
                <header class="px-6 py-4 border-b border-slate-200 flex items-center justify-between gap-3"><h2 class="text-lg font-semibold">Open Opportunities</h2><button id="collab-refresh" class="px-4 py-2 text-sm font-medium border border-slate-200 rounded hover:bg-slate-50 transition"><i class="fas fa-rotate-right mr-2"></i>Refresh</button></header>
                <div class="overflow-x-auto">
                    <table class="w-full text-sm">
                        <thead class="bg-slate-50 text-left text-xs uppercase text-slate-500"><tr><th class="px-4 py-3">Organization</th><th class="px-4 py-3">Lead Type</th><th class="px-4 py-3">Stage</th><th class="px-4 py-3">Value</th><th class="px-4 py-3">Next Action</th></tr></thead>
                        <tbody id="collab-body"><tr><td colspan="5" class="px-4 py-8 text-center text-slate-500">Loading collaboration leads...</td></tr></tbody>
                    </table>
                </div>
            </section>
        </main>
    </div>
    <script src="script.js?v=20260826a"></script>
    <script src="admin-control-center.js?v=20260514a"></script>
    <script src="js/admin-sidebar.js?v=20260601c" defer></script>
</body>
</html>
