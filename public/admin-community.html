<!DOCTYPE html>
<html lang="en">
<head>
    <script>if(/^(disciplined-disciples-1\.(web\.app|firebaseapp\.com))$/.test(location.hostname)){location.replace('https://disciplineddisciples.co.za'+location.pathname+location.search+location.hash);}</script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Community - Admin</title>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
    <script src="js/admin-auth-guard.js?v=20260602a"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="icon" type="image/png" href="Assets/45.png">
</head>
<body class="bg-slate-100 min-h-screen text-slate-900">
    <div class="flex min-h-screen">
        <aside id="admin-sidebar" class="w-64 bg-white border-r border-gray-200 fixed h-full overflow-y-auto z-30"></aside>

        <main class="flex-1 ml-64 p-8 space-y-6">
            <header class="flex items-center justify-between">
                <div><h1 class="text-2xl font-bold">Community Hub</h1><p class="text-slate-500">Feature testimonials, moderate stories, and keep engagement active.</p></div>
                <button id="community-toggle-form" class="px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition">Add Story</button>
            </header>

            <div id="community-alert" class="hidden rounded-lg border px-4 py-3 text-sm"></div>

            <section id="community-form-wrap" class="hidden bg-white rounded-xl shadow p-6">
                <h2 class="text-lg font-semibold mb-4">New Community Story</h2>
                <form id="community-form" class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <input id="community-name" type="text" required placeholder="Name" class="border border-slate-200 rounded-lg px-3 py-2">
                    <input id="community-role" type="text" placeholder="Role (e.g. Candidate Accountant)" class="border border-slate-200 rounded-lg px-3 py-2">
                    <textarea id="community-quote" required rows="4" placeholder="Story or testimonial" class="border border-slate-200 rounded-lg px-3 py-2 md:col-span-2"></textarea>
                    <div class="md:col-span-2 flex gap-3">
                        <button type="submit" class="px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition">Save Story</button>
                        <button id="community-cancel" type="button" class="px-4 py-2 border border-slate-200 rounded-lg hover:bg-slate-50 transition">Cancel</button>
                    </div>
                </form>
            </section>

            <section class="grid grid-cols-1 md:grid-cols-3 gap-6">
                <article class="bg-white rounded-xl shadow p-5"><p class="text-sm text-slate-500">Pending Testimonials</p><p id="community-stat-pending" class="text-3xl font-semibold mt-2">0</p></article>
                <article class="bg-white rounded-xl shadow p-5"><p class="text-sm text-slate-500">Approved</p><p id="community-stat-approved" class="text-3xl font-semibold mt-2">0</p></article>
                <article class="bg-white rounded-xl shadow p-5"><p class="text-sm text-slate-500">Featured</p><p id="community-stat-featured" class="text-3xl font-semibold mt-2">0</p></article>
            </section>

            <section class="bg-white rounded-xl shadow overflow-hidden">
                <header class="px-6 py-4 border-b border-slate-200 flex items-center justify-between gap-3">
                    <h2 class="text-lg font-semibold">Moderation Queue</h2>
                    <button id="community-refresh" class="px-4 py-2 text-sm font-medium border border-slate-200 rounded hover:bg-slate-50 transition"><i class="fas fa-rotate-right mr-2"></i>Refresh</button>
                </header>
                <div class="overflow-x-auto">
                    <table class="w-full text-sm">
                        <thead class="bg-slate-50 text-left text-xs uppercase text-slate-500">
                            <tr>
                                <th class="px-4 py-3">Name</th>
                                <th class="px-4 py-3">Role</th>
                                <th class="px-4 py-3">Quote</th>
                                <th class="px-4 py-3">Approved</th>
                                <th class="px-4 py-3">Featured</th>
                                <th class="px-4 py-3">Actions</th>
                            </tr>
                        </thead>
                        <tbody id="community-body">
                            <tr><td colspan="6" class="px-4 py-8 text-center text-slate-500">Loading community stories...</td></tr>
                        </tbody>
                    </table>
                </div>
            </section>
        </main>
    </div>
    <script src="script.js?v=20260513a"></script>
    <script src="admin-control-center.js?v=20260514a"></script>
    <script src="js/admin-sidebar.js?v=20260601c" defer></script>
</body>
</html>
